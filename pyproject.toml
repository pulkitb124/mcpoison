[project]
name = "mcpoison"
version = "0.1.0"
description = "Measuring (and defending against) indirect prompt injection in MCP agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pulkit Bhasin" }]

dependencies = [
    # Model provider SDKs
    "anthropic",
    "openai",
    "google-genai",
    # Model Context Protocol
    "mcp",
    # Config & data
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
analysis = [
    "pandas",
    "matplotlib",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
